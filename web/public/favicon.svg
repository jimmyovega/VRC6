<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!--
    VRC6 mark: a pixel "V" in the site's neon-green palette, with the offset
    drop shadow of an 8-bit title screen.

    Drawn on a 16x16 grid in 2px steps so every edge lands on a whole device
    pixel at 16px — hence shape-rendering="crispEdges" and flat rects rather
    than a path. Deliberately single-theme: the mark carries its own deep-moss
    ground so it reads the same in light and dark browser chrome, matching the
    site, which commits to one dark world.
  -->
  <rect width="16" height="16" fill="#052e16" />
  <!-- Shadow first: the same V offset +1,+1, so it only peeks out bottom-right. -->
  <g fill="#020c06">
    <rect x="3" y="2" width="2" height="6" />
    <rect x="11" y="2" width="2" height="6" />
    <rect x="5" y="8" width="2" height="4" />
    <rect x="9" y="8" width="2" height="4" />
    <rect x="7" y="12" width="2" height="4" />
  </g>
  <!-- The letter: two descending diagonals meeting at a 2px point. -->
  <g fill="#4ade80">
    <rect x="2" y="1" width="2" height="6" />
    <rect x="10" y="1" width="2" height="6" />
    <rect x="4" y="7" width="2" height="4" />
    <rect x="8" y="7" width="2" height="4" />
    <rect x="6" y="11" width="2" height="4" />
  </g>
</svg>
