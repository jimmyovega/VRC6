name: Test

# Runs unit + integration (vitest) and E2E (Playwright) on every PR.
# Both run D1 locally via Miniflare — no Cloudflare credentials required.
on:
  pull_request:
  workflow_dispatch:

# Least privilege — see deploy.yml. This one runs on pull_request, so it
# executes `npm ci` over branch-supplied lockfiles; the token it can reach
# should be read-only.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit + integration tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Provide a throwaway auth secret + admin email for the local E2E server
        run: |
          echo "BETTER_AUTH_SECRET=ci-e2e-not-a-real-secret-0123456789abcdef0123456789" > .dev.vars
          echo "ADMIN_EMAIL=owner@vrc6.com" >> .dev.vars
          echo "BETTER_AUTH_URL=http://localhost:8788" >> .dev.vars
          echo "TURNSTILE_DISABLED=1" >> .dev.vars
          echo "RATE_LIMIT_DISABLED=1" >> .dev.vars
          echo "EMAIL_DISABLED=1" >> .dev.vars
          echo "ALLOW_PUBLIC_SIGNUP=1" >> .dev.vars
          echo "SENTRY_ENVIRONMENT=ci" >> .dev.vars

      - name: Set up local D1 (build + migrate + seed)
        run: npm run e2e:setup

      # wrangler dev occasionally dies at cold-start under CI's concurrent
      # Playwright workers (bare "✘ [ERROR]" with no message, then every test
      # fails with ECONNREFUSED) — a known workerd/Miniflare stability issue
      # on GitHub-hosted runners (cloudflare/workerd#1075, #4391), unrelated
      # to app code: a rerun of the identical commit passes clean. Each retry
      # gets a genuinely fresh server, since Playwright's own
      # `reuseExistingServer: !CI` spins one up per invocation.
      #
      # Unlike a `gh run rerun` (a whole new VM), a retry here reuses this
      # job's local D1 file — a partially-completed failed attempt could
      # leave stale data for the next one, so re-seed between attempts.
      - name: Run E2E tests
        run: |
          for attempt in 1 2 3; do
            npm run test:e2e && exit 0
            echo "::warning::E2E attempt $attempt failed (likely the wrangler dev cold-start crash) — retrying"
            rm -rf .wrangler/state/v3/d1
            npm run db:migrate:local
            npm run db:seed:local
          done
          echo "::error::E2E tests failed after 3 attempts"
          exit 1

      - name: Run serial E2E tests (global site-wide state, e.g. maintenance mode)
        run: |
          for attempt in 1 2 3; do
            npm run test:e2e:serial && exit 0
            echo "::warning::Serial E2E attempt $attempt failed (likely the wrangler dev cold-start crash) — retrying"
            rm -rf .wrangler/state/v3/d1
            npm run db:migrate:local
            npm run db:seed:local
          done
          echo "::error::Serial E2E tests failed after 3 attempts"
          exit 1

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
