name: Deploy

# Builds the Astro app and deploys the Worker to Cloudflare on every push to main.
# Requires two repo secrets:
#   CLOUDFLARE_API_TOKEN   — scoped token (Workers Scripts:Edit, D1:Edit, Workers KV Storage:Edit)
#   CLOUDFLARE_ACCOUNT_ID  — your Cloudflare account id
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  # NOT cancel-in-progress: this job applies remote D1 migrations, and killing
  # it mid-migration can leave the remote database half-migrated.
  cancel-in-progress: false

# Least privilege. Without this the job token inherits the repository default,
# which on older repos is write-all — on a public repo that hands any malicious
# dependency in `npm ci` a write-capable token.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply D1 migrations (remote)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: d1 migrations apply vrc6-db --remote

      - name: Build
        run: npm run build
        env:
          # Enables Sentry source-map upload (astro.config gates on the token).
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: vrc6
          SENTRY_PROJECT: node-cloudflare-workers

      - name: Deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: deploy

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run prod smoke tests
        run: npm run test:prod-smoke
